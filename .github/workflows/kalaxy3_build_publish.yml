name: Kalaxy3 automated documentation generation and publication
on:
  pull_request:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      operation:
        description: Governed manual operation
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - promote-proven-stage
      promotion_source_sha:
        description: Exact source SHA whose successful portable-stage artifact is approved for promotion
        required: false
        type: string
      promotion_stage_run_id:
        description: Exact successful workflow run ID that produced the approved portable-stage artifact
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: kalaxy3-main-writer
  cancel-in-progress: false

jobs:
  sage-governance:
    name: SAGE source governance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run repository SAGE guardrails
      run: make sage-stage-guardrails

  mkdocs-validation:
    name: MkDocs Material publication validation
    needs: sage-governance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build and validate MkDocs publication output
      run: make docs-mkdocs-publication-test

  portable-stage:
    name: Portable OCI stage artifact
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    needs: [sage-governance, mkdocs-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STAGE_IMAGE: donb4iu/mynginx_docs
      STAGE_TAG: stage-${{ github.sha }}
      STAGE_ARCHIVE: ${{ github.workspace }}/sage-stage.oci.tar
      STAGE_ARTIFACT_NAME: sage-stage-oci-${{ github.sha }}

    steps:
    - name: Check out exact source SHA
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build once to a multi-architecture OCI stage artifact
      uses: docker/build-push-action@v6
      id: portable_stage_build
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        file: yaml/nginx-docs/k8s-doc-to-nginx/nginx/Dockerfile.stage
        push: false
        outputs: type=oci,dest=${{ env.STAGE_ARCHIVE }}
        tags: ${{ env.STAGE_IMAGE }}:${{ env.STAGE_TAG }}
        provenance: false
        build-args: |
          SAGE_SOURCE_SHA=${{ github.sha }}

    - name: Persist immutable OCI stage artifact
      uses: actions/upload-artifact@v4
      id: stage_artifact
      with:
        name: ${{ env.STAGE_ARTIFACT_NAME }}
        path: ${{ env.STAGE_ARCHIVE }}
        compression-level: 0
        if-no-files-found: error

    - name: Produce SAGE portable-stage receipt
      run: python3 scripts/sage/sage-stage-receipt.py --source-sha "${GITHUB_SHA}" --image-repository "${STAGE_IMAGE}" --stage-tag "${STAGE_TAG}" --index-digest "${{ steps.portable_stage_build.outputs.digest }}" --oci-archive "${STAGE_ARCHIVE}" --storage-artifact-name "${STAGE_ARTIFACT_NAME}" --storage-artifact-id "${{ steps.stage_artifact.outputs.artifact-id }}" --storage-artifact-digest "${{ steps.stage_artifact.outputs.artifact-digest }}" --workflow-run-id "${GITHUB_RUN_ID}" --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" --output "$RUNNER_TEMP/sage-stage-receipt.json"

    - name: Persist stage receipt
      uses: actions/upload-artifact@v4
      with:
        name: sage-stage-receipt-${{ github.sha }}
        path: ${{ runner.temp }}/sage-stage-receipt.json
        if-no-files-found: error

  doc:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name == 'push'
    needs: mkdocs-validation
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      id: Detected_push
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Generate MkDocs Material webpages
      id: Generating_webpages_from_commit
      run: make docs-mkdocs-generate

    - name: Commit generated documentation to Kalaxy3
      run: |
        git config --local user.email "dbuddenbaum@gmail.com"
        git config --local user.name "donb4iu"

        git add docs

        if git diff --cached --quiet; then
          echo "No generated documentation changes."
        else
          git commit -m "Generate Kalaxy3 MkDocs Material documentation [skip ci]"
        fi

        # Documentation is already committed. Discard any unintended
        # tracked working-tree changes left by the build.
        git restore --worktree .
        git pull --rebase origin main
        git push origin HEAD:main

    - name: Publish webpages to donb4iu.github.io
      uses: cpina/github-action-push-to-another-repository@main
      id: Publishing_to_gitpages
      env:
        API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
      with:
        source-directory: "docs"
        target-directory: "docs/Kalaxy3"
        destination-github-username: "donb4iu"
        destination-repository-name: "donb4iu.github.io"
        target-branch: "main"
        commit-message: "MkDocs Material webpage commit from Kalaxy3"
        user-email: "dbuddenbaum@gmail.com"
        user-name: "donb4iu"

    - name: Send Slack message
      uses: act10ns/slack@v2
      with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
      if: always()

  promote-proven-stage:
    name: Promote proven OCI stage artifact
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote-proven-stage'
    needs: [sage-governance, mkdocs-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PROMOTION_SOURCE_SHA: ${{ inputs.promotion_source_sha }}
      PROMOTION_STAGE_RUN_ID: ${{ inputs.promotion_stage_run_id }}
      PROMOTION_ROOT: ${{ runner.temp }}/sage-artifact-promotion
      SAGE_PROMOTION_ENVIRONMENT: ${{ github.workspace }}/infrastructure/k3s-homelab/cloudflare/sage-experience-promotion-environment.json

    steps:
    - name: Check out exact approved source SHA
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.promotion_source_sha }}

    - name: Verify dispatch is bound to exact current source and prior stage run
      run: |
        python3 - <<'PY'
        import os
        import re

        source_sha = os.environ["PROMOTION_SOURCE_SHA"]
        stage_run_id = os.environ["PROMOTION_STAGE_RUN_ID"]
        github_sha = os.environ["GITHUB_SHA"]
        if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
            raise SystemExit("promotion_source_sha must be an exact 40-character Git SHA")
        if source_sha != github_sha:
            raise SystemExit(
                "promotion_source_sha must equal the workflow-dispatch source SHA; "
                "dispatch the workflow from the exact approved branch head"
            )
        if not stage_run_id.isdigit():
            raise SystemExit("promotion_stage_run_id must be a numeric GitHub Actions run ID")
        print("PASS manual promotion dispatch is bound to exact current source SHA")
        print("PASS prior portable-stage workflow run ID is explicit")
        PY

    - name: Download exact portable-stage OCI artifact
      uses: actions/download-artifact@v4
      with:
        name: sage-stage-oci-${{ inputs.promotion_source_sha }}
        path: ${{ runner.temp }}/sage-stage-oci
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.promotion_stage_run_id }}

    - name: Download exact portable-stage receipt
      uses: actions/download-artifact@v4
      with:
        name: sage-stage-receipt-${{ inputs.promotion_source_sha }}
        path: ${{ runner.temp }}/sage-stage-receipt
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.promotion_stage_run_id }}

    - name: Verify downloaded receipt source/run lineage before credentials exist
      env:
        SAGE_STAGE_RECEIPT: ${{ runner.temp }}/sage-stage-receipt/sage-stage-receipt.json
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        receipt = json.loads(Path(os.environ["SAGE_STAGE_RECEIPT"]).read_text(encoding="utf-8"))
        source = receipt.get("source", {})
        invocation = receipt.get("invocation", {})
        artifact = receipt.get("artifact", {})
        storage = artifact.get("storage", {}) if isinstance(artifact, dict) else {}
        expected_name = "sage-stage-oci-" + os.environ["PROMOTION_SOURCE_SHA"]
        if source.get("git_sha") != os.environ["PROMOTION_SOURCE_SHA"]:
            raise SystemExit("downloaded stage receipt source SHA differs from approved source")
        if str(invocation.get("workflow_run_id")) != os.environ["PROMOTION_STAGE_RUN_ID"]:
            raise SystemExit("downloaded stage receipt run ID differs from approved stage run")
        if storage.get("artifact_name") != expected_name:
            raise SystemExit("downloaded stage receipt artifact name differs from approved source")
        print("PASS downloaded stage receipt is bound to exact approved source/run")
        PY

    - name: Install first qualified OCI promotion adapter
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo
        skopeo --version

    - name: Prepare immutable promotion before registry credentials are exposed
      env:
        SAGE_STAGE_RECEIPT: ${{ runner.temp }}/sage-stage-receipt/sage-stage-receipt.json
        SAGE_STAGE_ARCHIVE: ${{ runner.temp }}/sage-stage-oci/sage-stage.oci.tar
        SAGE_PROMOTION_EVENT_LOG: ${{ runner.temp }}/sage-artifact-promotion/promotion-events.jsonl
        SAGE_EXECUTOR_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
        SAGE_WORKFLOW_ENGINE: github-actions
      run: |
        mkdir -p "${PROMOTION_ROOT}"
        make sage-artifact-promotion-prepare | tee "${PROMOTION_ROOT}/promotion-prepare-output.txt"

    - name: Login to Docker Hub at the approved publication boundary
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Promote exact proven OCI content without rebuild
      env:
        SAGE_STAGE_RECEIPT: ${{ runner.temp }}/sage-stage-receipt/sage-stage-receipt.json
        SAGE_STAGE_ARCHIVE: ${{ runner.temp }}/sage-stage-oci/sage-stage.oci.tar
        SAGE_PROMOTION_EVENT_LOG: ${{ runner.temp }}/sage-artifact-promotion/promotion-events.jsonl
        SAGE_PROMOTION_RECEIPT: ${{ runner.temp }}/sage-artifact-promotion/promotion-receipt.json
        SAGE_EXECUTOR_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
        SAGE_WORKFLOW_ENGINE: github-actions
      run: make sage-artifact-promotion-execute

    - name: Verify immutable-promotion receipt invariants
      env:
        SAGE_PROMOTION_RECEIPT: ${{ runner.temp }}/sage-artifact-promotion/promotion-receipt.json
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        receipt = json.loads(Path(os.environ["SAGE_PROMOTION_RECEIPT"]).read_text(encoding="utf-8"))
        expected_sha = os.environ["PROMOTION_SOURCE_SHA"]
        expected = receipt.get("stage", {}).get("index_digest")
        verification = receipt.get("verification", {})
        if receipt.get("status") != "pass":
            raise SystemExit("promotion receipt status is not pass")
        if receipt.get("stage", {}).get("source_git_sha") != expected_sha:
            raise SystemExit("promotion receipt source SHA differs from approved source")
        if receipt.get("target", {}).get("index_digest") != expected:
            raise SystemExit("promoted target digest differs from proven stage digest")
        if verification.get("rebuild_performed") is not False:
            raise SystemExit("promotion receipt does not prove rebuild_performed=false")
        if verification.get("secrets_in_command_arguments") is not False:
            raise SystemExit("promotion receipt does not prove secret-free command arguments")
        print("PASS exact stage digest equals promoted target digest")
        print("PASS rebuild_performed=false")
        PY

    - name: Persist immutable-promotion evidence
      uses: actions/upload-artifact@v4
      with:
        name: sage-promotion-evidence-${{ inputs.promotion_source_sha }}
        path: |
          ${{ runner.temp }}/sage-artifact-promotion/promotion-receipt.json
          ${{ runner.temp }}/sage-artifact-promotion/promotion-events.jsonl
          ${{ runner.temp }}/sage-artifact-promotion/promotion-prepare-output.txt
        if-no-files-found: error
