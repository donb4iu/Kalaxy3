name: Architect Git observability projection
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: architect-git-observability
  cancel-in-progress: false
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate projection builder
        run: python3 -m unittest discover -s scripts/sage/architecture_helper -p test_git_observability.py
      - name: Produce shared Git state assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sage/architecture_helper/git_observability.py --repo . --out "$RUNNER_TEMP/architect-git-projection"
      - name: Store immutable publication candidate
        uses: actions/upload-artifact@v4
        with:
          name: architect-git-observability-${{ github.run_id }}
          path: ${{ runner.temp }}/architect-git-projection/
          retention-days: 14
