name: SAGE GitHub Projects permission probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projects-read-only-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe fixed read-only Projects query
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_OUTPUT_JSON: projects-probe-result.json
        run: python3 scripts/sage/projects_actions_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: projects-permission-probe
          path: projects-probe-result.json
          retention-days: 7
