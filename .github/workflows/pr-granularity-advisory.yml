name: PR granularity advisory

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  advise:
    name: Inspect PR scope (advisory only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Evaluate linked milestone issue and DoD
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! -f scripts/ci/pr_granularity_advisory.py ]]; then
            echo "::notice title=PR granularity advisory::Evaluator not present in trusted base revision; advisory begins after merge."
            {
              echo "### PR Granularity Advisory"
              echo ""
              echo "Not evaluated: trusted base revision has not yet installed the advisory."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/ci/pr_granularity_advisory.py
      - name: Evaluate objective-to-PR context continuity (advisory only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [[ ! -f scripts/ci/pr_context_continuity.py ]]; then
            echo "Continuity evaluator not yet in trusted base; advisory starts after merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/ci/pr_context_continuity.py

      - name: Checkout candidate PR for untrusted read-only evidence
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: untrusted-pr
          fetch-depth: 1
          persist-credentials: false
      - name: Project SAGE inquiry and work status (advisory)
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [[ ! -f scripts/ci/pr_inquiry_observation.py ]]; then
            echo "::notice title=SAGE inquiry advisory::Not evaluated: observer is absent from trusted base; available after promotion."
            {
              echo "### SAGE semantic inquiry and work view"
              echo ""
              echo "Not evaluated: the trusted base does not yet include the observer."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/ci/pr_inquiry_observation.py \
            --event "$GITHUB_EVENT_PATH" \
            --candidate untrusted-pr \
            --trusted . \
            --output "$RUNNER_TEMP/sage-pr-work"
      - name: Attach human-readable SAGE work view
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-pr-work-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/sage-pr-work/
          retention-days: 14
          if-no-files-found: warn
