#cloud-config
hostname: amd64-02
manage_etc_hosts: true
locale: en_US.UTF-8
timezone: America/Chicago

package_update: false
package_upgrade: false
package_reboot_if_required: false

packages: []
ssh_pwauth: true
disable_root: true

users:
  - name: pi
    primary_group: users
    groups: [users, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-rsa  donbuddenbaum@donbs-iMac"
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBPaaoAAmImR6hzULpGxF/Bq5ZfpERsYRHa1IJWQyGKN your_github_email@example.com
  - name: dbuddenbaum
    primary_group: users
    groups: [users, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    ssh_authorized_keys:
      - "ssh-rsa  donbuddenbaum@donbs-iMac"
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBPaaoAAmImR6hzULpGxF/Bq5ZfpERsYRHa1IJWQyGKN your_github_email@example.com
write_files:
  - path: /etc/netplan/50-cloud-init.yaml
    permissions: '0644'
    owner: root:root
    content: |
      network:
        version: 2
        ethernets:
          uplink0:
            match:
              name: "e*"
            dhcp4: false
            addresses:
              - 192.168.2.62/24
            routes:
              - to: default
                via: 192.168.2.1
            nameservers:
              addresses:
                - 192.168.2.1
                - 1.1.1.1
                - 8.8.8.8

  - path: /etc/hosts
    permissions: '0644'
    owner: root:root
    content: |
      127.0.0.1 localhost
      127.0.1.1 amd64-02

      192.168.2.7 nfs-server
      192.168.2.51 arm64-01
      192.168.2.52 arm64-02
      192.168.2.53 arm64-03
      192.168.2.54 arm64-04
      192.168.2.55 arm64-05
      192.168.2.61 amd64-01
      192.168.2.62 amd64-02
      192.168.2.63 amd64-03

      ::1 localhost ip6-localhost ip6-loopback
      ff02::1 ip6-allnodes
      ff02::2 ip6-allrouters

  - path: /usr/local/sbin/prepare-minio-disk.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      MOUNT_POINT="/mnt/minio"
      MIN_DATA_BYTES=800000000000

      log() {
        echo "[prepare-minio-disk] $1" >&2
      }

      fail() {
        echo "[prepare-minio-disk] ERROR: $1" >&2
        exit 1
      }

      require_command() {
        local command_name="$1"

        if ! command -v "${command_name}" >/dev/null 2>&1; then
          fail "Required command is missing: ${command_name}"
        fi
      }

      check_required_commands() {
        require_command awk
        require_command blkid
        require_command findmnt
        require_command lsblk
        require_command mkfs.xfs
        require_command parted
        require_command partprobe
        require_command sed
        require_command udevadm
        require_command wipefs
      }

      get_root_disk_name() {
        local parent_name
        local root_source

        root_source="$(findmnt -n -o SOURCE /)"

        if [[ -z "${root_source}" ]]; then
          fail "Unable to determine root filesystem source."
        fi

        parent_name="$(lsblk -no PKNAME "${root_source}" 2>/dev/null | head -n 1 || true)"

        if [[ -n "${parent_name}" ]]; then
          echo "${parent_name}"
          return
        fi

        if [[ -b "${root_source}" ]]; then
          basename "${root_source}"
          return
        fi

        fail "Unable to resolve root disk from ${root_source}."
      }

      list_minio_candidates() {
        local root_name

        root_name="$(get_root_disk_name)"

        lsblk -b -dn -o NAME,SIZE,TYPE,RM,ROTA |
          awk -v root="${root_name}" -v min_bytes="${MIN_DATA_BYTES}" '
            $1 != root &&
            $2 >= min_bytes &&
            $3 == "disk" &&
            $4 == 0 &&
            $5 == 1 {
              print "/dev/" $1
            }
          '
      }

      print_disk_inventory() {
        log "Detected disk inventory:"
        lsblk -o NAME,SIZE,TYPE,FSTYPE,LABEL,UUID,RM,ROTA,TRAN,MOUNTPOINTS,MODEL,SERIAL >&2 || true
      }

      select_minio_disk() {
        local candidates
        local count
        local root_name

        root_name="$(get_root_disk_name)"
        candidates="$(list_minio_candidates | sed '/^$/d')"
        count="$(printf '%s
      ' "${candidates}" | sed '/^$/d' | wc -l)"

        log "Detected root disk: /dev/${root_name}"

        if [[ "${count}" -ne 1 ]]; then
          log "Expected exactly one non-root, non-removable, rotational HDD >= ${MIN_DATA_BYTES} bytes."
          log "Matched MinIO candidates:"
          printf '%s
      ' "${candidates:-none}" >&2
          print_disk_inventory
          fail "Refusing to partition because MinIO disk selection was ambiguous."
        fi

        printf '%s
      ' "${candidates}"
      }

      partition_suffix() {
        local disk="$1"

        if [[ "${disk}" =~ nvme|mmcblk ]]; then
          echo "p1"
          return
        fi

        echo "1"
      }

      wait_for_partition() {
        local disk="$1"
        local part="$2"
        local attempt

        for attempt in {1..20}; do
          if [[ -b "${part}" ]]; then
            return
          fi

          partprobe "${disk}" >/dev/null 2>&1 || true
          udevadm settle >/dev/null 2>&1 || true
          sleep 1
        done

        fail "Expected partition ${part} was not created."
      }

      has_mounted_descendants() {
        local disk="$1"

        lsblk -nr -o MOUNTPOINTS "${disk}" | awk 'NF {found=1} END {exit !found}'
      }

      remove_minio_fstab_entries() {
        if [[ -f /etc/fstab ]]; then
          sed -i.bak '\|[[:space:]]/mnt/minio[[:space:]]|d' /etc/fstab
        fi
      }

      ensure_minio_mount() {
        local part="$1"
        local uuid

        mkdir -p "${MOUNT_POINT}"
        uuid="$(blkid -s UUID -o value "${part}" 2>/dev/null || true)"

        if [[ -z "${uuid}" ]]; then
          fail "Unable to determine UUID for ${part}."
        fi

        remove_minio_fstab_entries
        echo "UUID=${uuid} ${MOUNT_POINT} xfs defaults,nofail,x-systemd.device-timeout=10s 0 2" >> /etc/fstab

        mount "${MOUNT_POINT}" || mount -a
      }

      already_configured() {
        local part="$1"
        local fstype

        if [[ ! -b "${part}" ]]; then
          return 1
        fi

        fstype="$(blkid -s TYPE -o value "${part}" 2>/dev/null || true)"

        if [[ "${fstype}" != "xfs" ]]; then
          return 1
        fi

        log "Existing XFS partition found at ${part}; ensuring mount."
        ensure_minio_mount "${part}"
        return 0
      }

      wipe_reusable_disk() {
        local disk="$1"

        if has_mounted_descendants "${disk}"; then
          print_disk_inventory
          fail "${disk} has mounted filesystems; refusing to wipe a mounted disk."
        fi

        log "Wiping selected reusable MinIO disk: ${disk}"
        wipefs -a "${disk}" || true

        if command -v sgdisk >/dev/null 2>&1; then
          sgdisk --zap-all "${disk}" || true
        fi

        dd if=/dev/zero of="${disk}" bs=1M count=16 conv=fsync status=none || true
        partprobe "${disk}" >/dev/null 2>&1 || true
        udevadm settle >/dev/null 2>&1 || true
      }

      create_xfs_partition() {
        local disk="$1"
        local part="$2"

        log "Creating GPT and XFS partition on ${disk}."
        parted -s "${disk}" mklabel gpt
        parted -s "${disk}" mkpart primary xfs 1MiB 100%
        partprobe "${disk}" >/dev/null 2>&1 || true
        udevadm settle >/dev/null 2>&1 || true
        wait_for_partition "${disk}" "${part}"

        log "Formatting ${part} as XFS."
        mkfs.xfs -f "${part}"
      }

      main() {
        local disk
        local part

        check_required_commands
        disk="$(select_minio_disk)"
        part="${disk}$(partition_suffix "${disk}")"

        log "Selected MinIO disk: ${disk}"

        if already_configured "${part}"; then
          log "MinIO disk already prepared and mounted at ${MOUNT_POINT}."
          return
        fi

        wipe_reusable_disk "${disk}"
        create_xfs_partition "${disk}" "${part}"
        ensure_minio_mount "${part}"
        log "MinIO disk prepared and mounted at ${MOUNT_POINT}."
      }

      main "$@"

  - path: /etc/ssh/sshd_config.d/99-user-auth.conf
    permissions: '0644'
    owner: root:root
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes

      Match User pi
        PasswordAuthentication no
        KbdInteractiveAuthentication no
runcmd:
  -   - bash
      - -lc
      - netplan generate
  -   - bash
      - -lc
      - netplan apply
  -   - bash
      - -lc
      - for i in {1..60}; do if timedatectl show -p NTPSynchronized --value | grep -q yes; then exit 0; fi; sleep 2; done; timedatectl || true
  -   - bash
      - -lc
      - DEBIAN_FRONTEND=noninteractive apt-get update || true
  -   - bash
      - -lc
      - DEBIAN_FRONTEND=noninteractive apt-get install -y parted gdisk xfsprogs nfs-common open-iscsi || true
  -   - bash
      - -lc
      - systemctl enable --now iscsid || systemctl enable --now open-iscsi || true
  -   - bash
      - -lc
      - /usr/local/sbin/prepare-minio-disk.sh
  -   - bash
      - -lc
      - /usr/local/sbin/configure-cgroups-pi.sh
  -   - bash
      - -lc
      - /usr/sbin/sshd -t && systemctl restart ssh
final_message: "cloud-init completed for amd64-02"
chpasswd:
  expire: true
  list: |
    dbuddenbaum:TempPassword123
