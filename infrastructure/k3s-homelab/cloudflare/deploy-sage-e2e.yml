---
- name: Deploy SAGE zero-trust E2E origin and Cloudflare connector
  hosts: k3s_servers[0]
  gather_facts: false
  become: true

  vars:
    sage_e2e_render_dir: /tmp/kalaxy3-sage-e2e
    cloudflare_tunnel_token: >-
      {{
        lookup('file', cloudflare_tunnel_token_file)
        | trim
      }}

  pre_tasks:
    - name: Require explicit runtime inputs
      ansible.builtin.assert:
        that:
          - sage_external_hostname is defined
          - sage_external_hostname | length > 3
          - "'.' in sage_external_hostname"
          - "'://' not in sage_external_hostname"
          - cloudflare_tunnel_token_file is defined
          - cloudflare_tunnel_token | length > 40
        fail_msg: >-
          Provide a DNS hostname and a controller-local private tunnel-token file.
      no_log: true

  tasks:
    - name: Deploy bounded SAGE E2E runtime
      block:
        - name: Recreate bounded render directory
          ansible.builtin.file:
            path: "{{ sage_e2e_render_dir }}"
            state: absent

        - name: Create bounded render directory
          ansible.builtin.file:
            path: "{{ sage_e2e_render_dir }}"
            state: directory
            mode: "0700"

        - name: Render namespaces
          ansible.builtin.template:
            src: namespaces.yaml.j2
            dest: "{{ sage_e2e_render_dir }}/namespaces.yaml"
            mode: "0600"

        - name: Render SAGE experience
          ansible.builtin.template:
            src: sage-experience.yaml.j2
            dest: "{{ sage_e2e_render_dir }}/sage-experience.yaml"
            mode: "0600"

        - name: Render cloudflared connector
          ansible.builtin.template:
            src: cloudflared.yaml.j2
            dest: "{{ sage_e2e_render_dir }}/cloudflared.yaml"
            mode: "0600"

        - name: Render ephemeral tunnel secret
          ansible.builtin.template:
            src: cloudflared-secret.yaml.j2
            dest: "{{ sage_e2e_render_dir }}/cloudflared-secret.yaml"
            mode: "0600"
          no_log: true

        - name: Apply bounded namespaces
          ansible.builtin.command:
            argv:
              - k3s
              - kubectl
              - apply
              - -f
              - "{{ sage_e2e_render_dir }}/namespaces.yaml"
          register: namespace_apply
          changed_when: >-
            'configured' in namespace_apply.stdout
            or 'created' in namespace_apply.stdout

        - name: Apply tunnel token secret
          ansible.builtin.command:
            argv:
              - k3s
              - kubectl
              - apply
              - -f
              - "{{ sage_e2e_render_dir }}/cloudflared-secret.yaml"
          no_log: true
          changed_when: true

        - name: Apply cloudflared connector
          ansible.builtin.command:
            argv:
              - k3s
              - kubectl
              - apply
              - -f
              - "{{ sage_e2e_render_dir }}/cloudflared.yaml"
          register: cloudflared_apply
          changed_when: >-
            'configured' in cloudflared_apply.stdout
            or 'created' in cloudflared_apply.stdout

        - name: Apply SAGE experience
          ansible.builtin.command:
            argv:
              - k3s
              - kubectl
              - apply
              - -f
              - "{{ sage_e2e_render_dir }}/sage-experience.yaml"
          register: experience_apply
          changed_when: >-
            'configured' in experience_apply.stdout
            or 'created' in experience_apply.stdout

        - name: Wait for SAGE experience rollout
          ansible.builtin.command:
            argv:
              - k3s
              - kubectl
              - -n
              - documentation
              - rollout
              - status
              - deployment/sage-experience
              - --timeout=180s
          changed_when: false

        - name: Wait for cloudflared rollout
          ansible.builtin.command:
            argv:
              - k3s
              - kubectl
              - -n
              - external-access
              - rollout
              - status
              - deployment/cloudflared
              - --timeout=180s
          changed_when: false
      always:
        - name: Remove all rendered runtime material
          ansible.builtin.file:
            path: "{{ sage_e2e_render_dir }}"
            state: absent
          no_log: true
