---
- name: Install Prometheus and Grafana
  ansible.builtin.command: >-
    {{ helm_binary }} upgrade --install kube-prometheus-stack
    prometheus-community/kube-prometheus-stack
    --version {{ helm_chart_lock.charts.kube_prometheus_stack.version }}
    --namespace observability
    --create-namespace
    --set prometheus.prometheusSpec.retention={{
      prometheus_retention
    }}
    --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName={{
      nfs_ssd_storage_class
    }}
    --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage={{
      prometheus_storage_size
    }}
    --set grafana.persistence.enabled=true
    --set grafana.persistence.storageClassName={{
      nfs_ssd_storage_class
    }}
    --set grafana.persistence.size={{
      grafana_storage_size
    }}
    --set grafana.service.type=LoadBalancer
    --set grafana.service.loadBalancerIP=192.168.2.25
    --set alertmanager.alertmanagerSpec.storage.volumeClaimTemplate.spec.storageClassName={{
      nfs_ssd_storage_class
    }}
    --set alertmanager.alertmanagerSpec.storage.volumeClaimTemplate.spec.resources.requests.storage=5Gi
    --wait
    --timeout 20m
  environment: "{{ helm_environment }}"
  when: install_observability | bool
  changed_when: true

- name: Reconcile centralized logging workload-pool labels
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: Node
    name: "{{ item }}"
    definition:
      metadata:
        labels:
          kalaxy3.io/workload-pool: >-
            {{
              hostvars[item].kalaxy3_node_labels[
                'kalaxy3.io/workload-pool'
              ]
            }}
    kubeconfig: "{{ kalaxy3_kubeconfig }}"
  loop:
    - amd64-01
    - amd64-02
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging

- name: Find eligible centralized logging platform nodes
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - nodes
      - >-
        --selector=kubernetes.io/arch=amd64,kalaxy3.io/workload-pool={{
          centralized_logging_workload_pool
        }}
      - --output=name
  register: centralized_logging_eligible_nodes
  changed_when: false
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging

- name: Require the intended centralized logging node
  ansible.builtin.assert:
    that:
      - >-
        centralized_logging_eligible_nodes.stdout_lines
        ==
        ['node/' ~ centralized_logging_expected_node]
    fail_msg: >-
      Centralized logging requires exactly {{
        centralized_logging_expected_node
      }} labeled with
      kalaxy3.io/workload-pool={{
        centralized_logging_workload_pool
      }}. Found {{
        centralized_logging_eligible_nodes.stdout_lines
      }}.
    success_msg: >-
      Centralized logging is assigned to {{
        centralized_logging_expected_node
      }}.
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging

- name: Write Loki Helm values
  ansible.builtin.template:
    src: loki-values.yml.j2
    dest: /tmp/loki-values.yml
    mode: "0644"
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging
    - loki

- name: Install Loki
  kubernetes.core.helm:
    release_name: loki
    chart_ref: oci://ghcr.io/grafana-community/helm-charts/loki
    chart_version: "{{ loki_chart_version }}"
    release_namespace: "{{ centralized_logging_namespace }}"
    create_namespace: true
    state: present
    reset_values: true
    values_files:
      - /tmp/loki-values.yml
    wait: true
    timeout: 20m
    kubeconfig: "{{ kalaxy3_kubeconfig }}"
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging
    - loki

- name: Write Fluent Bit Collector Helm values
  ansible.builtin.template:
    src: fluent-bit-collector-values.yml.j2
    dest: /tmp/fluent-bit-collector-values.yml
    mode: "0644"
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging
    - fluent-bit

- name: Install Fluent Bit Collector
  kubernetes.core.helm:
    release_name: fluent-bit-collector
    chart_ref: >-
      oci://ghcr.io/fluent/helm-charts/fluent-bit-collector
    chart_version: "{{ fluent_bit_collector_chart_version }}"
    release_namespace: "{{ centralized_logging_namespace }}"
    create_namespace: true
    state: present
    reset_values: true
    values_files:
      - /tmp/fluent-bit-collector-values.yml
    wait: true
    timeout: 20m
    kubeconfig: "{{ kalaxy3_kubeconfig }}"
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging
    - fluent-bit

- name: Write Grafana Loki datasource
  ansible.builtin.template:
    src: grafana-loki-datasource.yml.j2
    dest: /tmp/grafana-loki-datasource.yml
    mode: "0644"
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging
    - grafana

- name: Provision Grafana Loki datasource
  kubernetes.core.k8s:
    state: present
    src: /tmp/grafana-loki-datasource.yml
    kubeconfig: "{{ kalaxy3_kubeconfig }}"
  when:
    - install_observability | bool
    - deploy_centralized_logging | bool
  tags:
    - centralized-logging
    - grafana

- name: Find eligible Kubecost Intel nodes
  ansible.builtin.command:
    argv:
      - k3s
      - kubectl
      - get
      - nodes
      - --selector=kubernetes.io/arch=amd64,kalaxy3.io/kubecost=true
      - --output=name
  register: kubecost_eligible_nodes
  changed_when: false
  tags:
    - kubecost
  when:
    - install_observability | bool
    - install_kubecost | bool

- name: Write Kubecost Helm values
  ansible.builtin.template:
    src: kubecost-values.yml.j2
    dest: /tmp/kubecost-values.yml
    mode: "0644"
  when:
    - install_observability | bool
    - install_kubecost | bool
    - kubecost_eligible_nodes.stdout | trim | length > 0

- name: Prepare calibrated Kubecost pricing
  ansible.builtin.include_tasks:
    file: kubecost-calibration.yml
    apply:
      tags:
        - kubecost
        - kubecost-calibration
  when:
    - install_observability | bool
    - install_kubecost | bool
    - kubecost_eligible_nodes.stdout | trim | length > 0
  tags:
    - kubecost
    - kubecost-calibration

- name: Install Helm Diff plugin
  kubernetes.core.helm_plugin:
    binary_path: "{{ helm_binary }}"
    plugin_path: https://github.com/databus23/helm-diff
    plugin_version: "{{ helm_diff_plugin_version }}"
    state: present
  environment: "{{ helm_environment }}"
  when:
    - install_observability | bool
    - install_kubecost | bool
    - kubecost_eligible_nodes.stdout | trim | length > 0
  tags:
    - kubecost

- name: Install Kubecost
  kubernetes.core.helm:
    binary_path: "{{ helm_binary }}"
    release_name: kubecost
    chart_ref: oci://public.ecr.aws/kubecost/kubecost
    chart_version: "{{ helm_chart_lock.charts.kubecost.version }}"
    release_namespace: kubecost
    create_namespace: true
    state: present
    reset_values: true
    values_files:
      - /tmp/kubecost-values.yml
      - "{{ kubecost_calibration_values_path }}"
    wait: true
    timeout: 30m
    kubeconfig: "{{ kalaxy3_kubeconfig }}"
  environment: "{{ helm_environment }}"
  when:
    - install_observability | bool
    - install_kubecost | bool
    - kubecost_eligible_nodes.stdout | trim | length > 0
  tags:
    - kubecost

- name: Report that Kubecost is waiting for an Intel node
  ansible.builtin.debug:
    msg: >-
      Kubecost was skipped because no labeled amd64 node is currently
      available. Label an Intel node with kalaxy3.io/kubecost=true and
      rerun the observability phase.
  when:
    - install_observability | bool
    - install_kubecost | bool
    - kubecost_eligible_nodes.stdout | trim | length == 0
