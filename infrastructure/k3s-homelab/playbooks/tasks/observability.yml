---
- name: Install Prometheus and Grafana
  ansible.builtin.command: >-
    helm upgrade --install kube-prometheus-stack
    prometheus-community/kube-prometheus-stack
    --namespace observability --create-namespace
    --set prometheus.prometheusSpec.retention={{ prometheus_retention }}
    --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName={{ nfs_ssd_storage_class }}
    --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage={{ prometheus_storage_size }}
    --set grafana.persistence.enabled=true
    --set grafana.persistence.storageClassName={{ nfs_ssd_storage_class }}
    --set grafana.persistence.size={{ grafana_storage_size }}
    --set grafana.service.type=LoadBalancer
    --set grafana.service.loadBalancerIP=192.168.2.25
    --set alertmanager.alertmanagerSpec.storage.volumeClaimTemplate.spec.storageClassName={{ nfs_ssd_storage_class }}
    --set alertmanager.alertmanagerSpec.storage.volumeClaimTemplate.spec.resources.requests.storage=5Gi
    --wait --timeout 20m
  when: install_observability
  changed_when: true

- name: Install Kubecost
  ansible.builtin.command: >-
    helm upgrade --install kubecost kubecost/cost-analyzer
    --namespace kubecost --create-namespace
    --set global.prometheus.enabled=false
    --set global.prometheus.fqdn=http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
    --set persistentVolume.enabled=true
    --set persistentVolume.storageClass={{ nfs_ssd_storage_class }}
    --set persistentVolume.size={{ kubecost_storage_size }}
    --set service.type=LoadBalancer
    --set service.loadBalancerIP=192.168.2.26
    --wait --timeout 20m
  when: install_kubecost
  changed_when: true
