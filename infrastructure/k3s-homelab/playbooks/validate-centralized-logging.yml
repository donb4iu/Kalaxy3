---
- name: Render staged centralized logging configuration
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars_files:
    - ../inventory/group_vars/all/main.yml

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # Override any inventory-level ansible_become connection variable.
    ansible_become: false
    centralized_logging_render_dir: >-
      /tmp/kalaxy3-centralized-logging-render

  pre_tasks:
    - name: Require the repository-managed controller interpreter
      ansible.builtin.assert:
        that:
          - >-
            ansible_playbook_python
            is match('^.*/\\.venv/bin/python$')
          - ansible_python_interpreter == ansible_playbook_python
        fail_msg: |
          SAGE ACTION BLOCKED

          Attempted action:
            Render staged centralized-logging configuration.

          Detected state:
            The playbook is running with
            ansible_playbook_python={{ ansible_playbook_python }} instead
            of the repository-managed .venv interpreter.

          Why this is invalid:
            Global or Homebrew Ansible can use different dependency
            versions and produce non-reproducible validation evidence.

          Likely intended outcome:
            SAGE infers that the operator intended to validate the
            repository-owned centralized-logging configuration.

          Confirm the correct approach:
            From the Kalaxy3 repository root, run:
              SAGE_REQUEST='Validate centralized logging' make sage-preflight
            Authoritative paths:
              infrastructure/k3s-homelab/Makefile
              infrastructure/k3s-homelab/playbooks/validate-centralized-logging.yml
              markdown/standards/kalaxy3-sage-actionable-failure-contract.md

          Allowed actions:
            - Run the repository Make target shown below.
            - Inspect repository-owned preflight and guardrail output.
            - Preserve this failure in terminal evidence.

          Prohibited actions:
            - Do not bypass this assertion.
            - Do not use global, Homebrew, or unpinned Ansible.
            - Do not edit generated evidence directly.

          Canonical recovery:
            cd infrastructure/k3s-homelab
            make centralized-logging-render

          SAGE integrity requirements:
            Preserve repository-managed tooling, authoritative files,
            guardrails, terminal evidence, and frequent validated pushes.

          Repository gap:
            If the Make target is missing or fails to identify the next
            valid lifecycle action, run repository discovery and record a
            SAGE systemic improvement action.
        success_msg: >-
          Using repository-managed Python:
          {{ ansible_playbook_python }}

    - name: Require staged activation gate
      ansible.builtin.assert:
        that:
          - not (deploy_centralized_logging | bool)
        fail_msg: |
          SAGE ACTION BLOCKED

          Attempted action:
            Render-only validation for staged centralized logging.

          Detected state:
            deploy_centralized_logging={{
              deploy_centralized_logging | bool
            }}. Centralized logging is active, while this validator
            requires the inactive staged state.

          Why this is invalid:
            This playbook validates rendered configuration before
            activation. Changing the gate only to satisfy this validator
            or bypassing the assertion would falsify lifecycle state and
            weaken SAGE evidence integrity.

          Likely intended outcome:
            SAGE infers that the operator intended to validate the health
            and usefulness of the active centralized-logging deployment.

          Confirm the correct approach:
            From the Kalaxy3 repository root, run:
              SAGE_REQUEST='Validate active centralized logging' make sage-preflight
            Confirm the gate in:
              infrastructure/k3s-homelab/inventory/group_vars/all/main.yml
            Review:
              markdown/operations/kalaxy3-centralized-logging-deployment-evidence.md
              markdown/standards/kalaxy3-sage-actionable-failure-contract.md

          Allowed actions:
            - Run repository-owned active runtime validation.
            - Inspect active releases, workloads, storage, and Loki data.
            - Preserve failed and successful validation evidence.
            - Record a repository capability gap when no runtime target exists.

          Prohibited actions:
            - Do not set deploy_centralized_logging=false to satisfy this playbook.
            - Do not bypass this assertion.
            - Do not substitute ad hoc kubectl, Helm, or global Ansible workflows.
            - Do not discard the failed-path evidence.

          Canonical recovery:
            cd infrastructure/k3s-homelab
            make centralized-logging-runtime-validate

          SAGE integrity requirements:
            Run repository discovery and required source, deployment,
            cluster, index, and evidence guardrails. Preserve activation,
            chart locks, storage, rollback authority, and frequent
            validated pushes.

          Repository gap:
            If centralized-logging-runtime-validate is unavailable, the
            repository lacks a canonical active-state validator. Do not
            improvise one-off validation; register and correct the gap.
        success_msg: >-
          Centralized logging remains staged and inactive.

    - name: Recreate centralized logging render directory
      ansible.builtin.file:
        path: "{{ centralized_logging_render_dir }}"
        state: absent

    - name: Create centralized logging render directory
      ansible.builtin.file:
        path: "{{ centralized_logging_render_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: Render Loki Helm values
      ansible.builtin.template:
        src: templates/loki-values.yml.j2
        dest: >-
          {{ centralized_logging_render_dir }}/loki-values.yml
        mode: "0644"

    - name: Render Fluent Bit Collector Helm values
      ansible.builtin.template:
        src: templates/fluent-bit-collector-values.yml.j2
        dest: >-
          {{ centralized_logging_render_dir }}/fluent-bit-values.yml
        mode: "0644"

    - name: Render Grafana Loki datasource
      ansible.builtin.template:
        src: templates/grafana-loki-datasource.yml.j2
        dest: >-
          {{
            centralized_logging_render_dir
          }}/grafana-loki-datasource.yml
        mode: "0644"

    - name: Validate rendered YAML
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/validate-centralized-logging-yaml.py"
          - "{{ centralized_logging_render_dir }}"
      register: centralized_logging_yaml_validation
      changed_when: false

    - name: Show rendered YAML validation
      ansible.builtin.debug:
        var: centralized_logging_yaml_validation.stdout_lines
