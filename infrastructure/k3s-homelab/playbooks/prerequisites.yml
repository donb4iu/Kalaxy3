---
- name: Prepare all K3s nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Install operating-system prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - open-iscsi
          - nfs-common
          - python3
          - python3-apt
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap persistently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(.*\sswap\s+.*)$'
        replace: '# \1'

    - name: Enable and start iSCSI daemon
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: true

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: true

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop:
        - br_netfilter
        - overlay

- name: Validate MinIO disks
  hosts: minio_nodes
  become: true
  tasks:
    - name: Check MinIO mountpoint
      ansible.builtin.command: findmnt --mountpoint {{ minio_mount_path }}
      register: minio_mount
      changed_when: false
      failed_when: false

    - name: Stop when the dedicated MinIO disk is not mounted
      ansible.builtin.assert:
        that:
          - minio_mount.rc == 0
        fail_msg: >-
          {{ minio_mount_path }} is not a mounted filesystem on
          {{ inventory_hostname }}. Mount the 1-TB HDD there by UUID first;
          this playbook deliberately will not format disks.
