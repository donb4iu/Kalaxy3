---
- name: Bootstrap Kalaxy3 static network
  hosts: all
  become: true
  gather_facts: true

  vars:
    kalaxy3_prefix_length: 24
    kalaxy3_gateway: 192.168.2.1
    kalaxy3_dns_servers:
      - 192.168.2.1

  pre_tasks:
    - name: Validate bootstrap configuration
      ansible.builtin.assert:
        that:
          - kalaxy3_hostname is defined
          - kalaxy3_static_ip is defined
          - ansible_hostname == kalaxy3_hostname
          - ansible_architecture == "x86_64"
          - ansible_default_ipv4.interface | length > 0
        fail_msg: >-
          Host identity, architecture, interface, or required variables
          are incorrect.

    - name: Check whether the static address is already in use
      ansible.builtin.command:
        argv:
          - ping
          - -c
          - "1"
          - -W
          - "1"
          - "{{ kalaxy3_static_ip }}"
      delegate_to: localhost
      become: false
      register: kalaxy3_ip_probe
      changed_when: false
      failed_when: false

    - name: Refuse to overwrite an address already in use
      ansible.builtin.assert:
        that:
          - kalaxy3_ip_probe.rc != 0
        fail_msg: >-
          {{ kalaxy3_static_ip }} responded to ping and may already be in use.

  tasks:
    - name: Install the Kalaxy3 static Netplan configuration
      ansible.builtin.copy:
        dest: /etc/netplan/60-kalaxy3-static.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              {{ ansible_default_ipv4.interface }}:
                dhcp4: false
                addresses:
                  - {{ kalaxy3_static_ip }}/{{ kalaxy3_prefix_length }}
                routes:
                  - to: default
                    via: {{ kalaxy3_gateway }}
                nameservers:
                  addresses:
          {% for dns_server in kalaxy3_dns_servers %}
                    - {{ dns_server }}
          {% endfor %}

    - name: Validate the Netplan configuration
      ansible.builtin.command:
        argv:
          - netplan
          - generate
      changed_when: false

    - name: Apply Netplan after returning control to Ansible
      ansible.builtin.shell: |
        sleep 2
        netplan apply
      async: 45
      poll: 0
      changed_when: true

    - name: Wait for SSH on the new static address
      ansible.builtin.wait_for:
        host: "{{ kalaxy3_static_ip }}"
        port: 22
        delay: 3
        timeout: 60
      delegate_to: localhost
      become: false
