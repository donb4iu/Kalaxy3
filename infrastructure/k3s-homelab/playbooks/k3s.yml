---
- name: Install the first K3s server
  hosts: k3s_servers[0]
  become: true
  serial: 1
  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Write initial K3s server configuration
      ansible.builtin.template:
        src: ../templates/k3s-server-config.yml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      notify: Restart K3s

    - name: Install first K3s server
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | sh -s - server
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    - name: Apply pending K3s restart
      ansible.builtin.meta: flush_handlers

    - name: Wait for the Kubernetes API
      ansible.builtin.command: k3s kubectl get nodes
      register: first_server_ready
      retries: 30
      delay: 5
      until: first_server_ready.rc == 0
      changed_when: false

    - name: Read cluster join token
      ansible.builtin.slurp:
        src: "{{ k3s_token_file }}"
      register: token_data
      no_log: true

    - name: Save cluster token as a delegated fact
      ansible.builtin.set_fact:
        k3s_cluster_token: "{{ token_data.content | b64decode | trim }}"
      no_log: true
  handlers:
    - name: Restart K3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted

- name: Join the remaining K3s servers
  hosts: k3s_servers[1:]
  become: true
  serial: 1
  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Write K3s server configuration
      ansible.builtin.template:
        src: ../templates/k3s-server-config.yml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      no_log: true
      notify: Restart K3s

    - name: Install and join K3s server
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | sh -s - server
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    - name: Apply pending K3s restart
      ansible.builtin.meta: flush_handlers

    - name: Wait for the Kubernetes API
      ansible.builtin.command:
        cmd: k3s kubectl get --raw=/readyz
      register: server_ready
      retries: 30
      delay: 5
      until:
        - server_ready.rc == 0
        - server_ready.stdout == "ok"
      changed_when: false

  handlers:
    - name: Restart K3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted

- name: Join K3s agents
  hosts: k3s_agents
  become: true
  serial: 1

  tasks:
    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Write K3s agent configuration
      ansible.builtin.template:
        src: ../templates/k3s-agent-config.yml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
      no_log: true
      notify: Restart K3s agent

    - name: Install and join K3s agent
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | sh -s - agent
      environment:
        INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s-agent

    - name: Apply pending K3s agent restart
      ansible.builtin.meta: flush_handlers

    - name: Wait for K3s agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: true

  handlers:
    - name: Restart K3s agent
      ansible.builtin.systemd:
        name: k3s-agent
        state: restarted

- name: Export kubeconfig to the Mac
  hosts: k3s_servers[0]
  become: true
  tasks:
    - name: Read K3s kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_data
      no_log: true

    - name: Write kubeconfig locally
      ansible.builtin.copy:
        content: >-
          {{ (kubeconfig_data.content | b64decode) |
             replace('https://127.0.0.1:6443',
                     'https://' + k3s_api_endpoint + ':6443') }}
        dest: "{{ playbook_dir }}/../kubeconfig-kalaxy3.yaml"
        mode: '0600'
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
      no_log: true
