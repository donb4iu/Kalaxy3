---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: longhorn-system
spec:
  ipAllowList:
    sourceRange:
      - 192.168.2.0/24

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: longhorn-system
spec:
  basicAuth:
    secret: ui-basic-auth
    removeHeader: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`longhorn.kalaxy3.home.arpa`)
      middlewares:
        - name: lan-only
        - name: basic-auth
      services:
        - name: longhorn-frontend
          port: 80

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: observability
spec:
  ipAllowList:
    sourceRange:
      - 192.168.2.0/24

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: observability
spec:
  basicAuth:
    secret: ui-basic-auth
    removeHeader: true

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-ui
  namespace: observability
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`prometheus.kalaxy3.home.arpa`)
      middlewares:
        - name: lan-only
        - name: basic-auth
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
