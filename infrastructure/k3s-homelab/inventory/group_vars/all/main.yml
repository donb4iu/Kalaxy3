---
cluster_name: kalaxy3
k3s_channel: stable
k3s_version: "v1.36.2+k3s1"
helm_diff_plugin_version: "v3.15.10"
k3s_token_file: /var/lib/rancher/k3s/server/node-token
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_cluster_dns: 10.43.0.10
k3s_disable:
  - servicelb

metallb_pool_name: lan-pool
metallb_address_range: 192.168.2.20-192.168.2.49
traefik_load_balancer_ip: 192.168.2.20
headlamp_load_balancer_ip: 192.168.2.22
minio_api_load_balancer_ip: 192.168.2.23
minio_console_load_balancer_ip: 192.168.2.24

nfs_server: 192.168.2.7
nfs_hdd_path: /export/nfs-hdd
nfs_ssd_path: /export/nfs-ssd
nfs_hdd_storage_class: nfs-hdd
nfs_ssd_storage_class: nfs-ssd

minio_mount_path: /mnt/minio
minio_storage_class: minio-local
minio_volume_size: 900Gi
minio_root_user: minioadmin
# Store the real value with Ansible Vault before running platform.yml.
minio_root_password: !vault |
          $ANSIBLE_VAULT;1.2;AES256;kalaxy3
          36386138626361376361623335613330396435323231633162616262363966613937653032663637
          6165316639353061373865313339366265363161633662310a656236613239326162393034653164
          37616335333636383430346237636434386664366363396465333265343334663735623533643237
          3162626339613031630a613838343639643566376562653662393864326663626264333439613837
          3930
minio_image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z

install_longhorn: true
longhorn_data_path: /mnt/longhorn
longhorn_allowed_filesystems:
  - ext4
  - xfs
# Use two replicas across the AMD64 Longhorn storage nodes.
# Existing volumes must be updated separately.
longhorn_replica_count: 2

install_headlamp: true
install_observability: true
# Centralized logging deployment activation gate.
deploy_centralized_logging: true
install_kubecost: false
install_minio: true

prometheus_retention: 7d
prometheus_storage_size: 40Gi
grafana_storage_size: 10Gi

centralized_logging_namespace: observability
centralized_logging_workload_pool: platform-services
centralized_logging_expected_node: amd64-02
loki_storage_class: longhorn
loki_storage_size: 40Gi
loki_retention_period: 168h

kubecost_storage_size: 32Gi

local_domain: home.donb4iu.com
grafana_host: grafana.home.donb4iu.com
headlamp_host: k8s.home.donb4iu.com
minio_console_host: minio.home.donb4iu.com

k3s_api_endpoint: 192.168.2.50

k3s_api_vip: 192.168.2.50
k3s_api_interface: eth0

k3s_tls_sans:
  - 192.168.2.51
  - 192.168.2.50
